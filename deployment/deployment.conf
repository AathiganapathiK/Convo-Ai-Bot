###############################################################################
# Retail AI Deployment Configuration
# Edit this file according to your deployment environment.
###############################################################################
# NOTE: This file MUST be named exactly "deployment.conf" (no extra "e").
# All scripts source it with that exact spelling.
###############################################################################

########################################
# Project Information
########################################

PROJECT_NAME="Retail AI Analytics Platform"
PROJECT_SHORT_NAME="retail-ai"
DEPLOY_USER="ubuntu"
DEPLOY_GROUP="ubuntu"

########################################
# Installation Directories
########################################

INSTALL_ROOT="/opt/retail-ai"
BACKEND_DIR="${INSTALL_ROOT}/backend"
FRONTEND_DIR="${INSTALL_ROOT}/frontend"
DEPLOYMENT_DIR="${INSTALL_ROOT}/deployment"
LOG_DIR="/var/log/retail-ai"

########################################
# Backend
########################################

PYTHON_BIN="python3"
VENV_NAME="venv"
BACKEND_PORT="8000"
BACKEND_HOST="127.0.0.1"
SYSTEMD_SERVICE_NAME="retail-ai-backend"

########################################
# Frontend
########################################

FRONTEND_BUILD_DIR="build"
NGINX_SITE_NAME="retail-ai"
NGINX_ROOT="/var/www/retail-ai"

########################################
# SQL Server
########################################
# CONFIRMED: SQL Server will be installed fresh on this same machine
# (Ubuntu 24.04, GPU server). SQL_IS_LOCAL=true means 02_install_sqlserver.sh
# will install the mssql-server engine here, and 10_start_services.sh will
# manage it as a local systemd service.
########################################

SQL_IS_LOCAL=true

SQL_HOST="localhost"          # change to the DB server's IP/hostname if SQL_IS_LOCAL=false
SQL_PORT="1433"
SQL_SERVICE_NAME="mssql-server"   # only relevant/used if SQL_IS_LOCAL=true

# Admin account used ONLY for restoring backups / running migrations.
# This is asked for interactively at runtime — nothing is stored here.
SQL_ADMIN_USER="sa"

########################################
# Application Database Authentication
########################################
# The app itself (backend/database.py) now uses SQL Server Authentication,
# NOT Windows trusted_connection (which does not work on Linux).
# These values get written into backend/.env — see backend.env.example.
########################################

DB_TYPE="mssql"
DB_DRIVER="ODBC Driver 18 for SQL Server"

########################################
# Platform / Client Databases
########################################

PLATFORM_DATABASE="RR_platform"
CLIENT_DATABASE="adv_works"

########################################
# Backup Files
########################################
# Place your .bak files here before running 03_restore_database.sh.
# If SQL_IS_LOCAL=false, these files must exist on the DB SERVER's own disk
# (SQL Server reads backup files server-side) — copy them there manually or
# via a shared/mounted path, then point DATABASE_BACKUP_DIR at that path.
########################################

DATABASE_BACKUP_DIR="${INSTALL_ROOT}/database"
PLATFORM_BACKUP_FILE="RR_platform.bak"
CLIENT_BACKUP_FILE="adv_works.bak"

########################################
# Migration Files
########################################

MIGRATION_DIR="${BACKEND_DIR}/migrations"
MIGRATION_1="001_security_framework.sql"
MIGRATION_2="002_semantic_audit_types.sql"

########################################
# Environment Files
########################################

BACKEND_ENV_FILE="${BACKEND_DIR}/.env"
FRONTEND_ENV_FILE="${FRONTEND_DIR}/.env"

########################################
# Microsoft ODBC
########################################

ODBC_DRIVER="ODBC Driver 18 for SQL Server"

########################################
# Node
########################################

NODE_MAJOR_VERSION="20"

########################################
# Health Check
########################################

BACKEND_HEALTH_ENDPOINT="http://127.0.0.1:8000"

########################################
# Optional Components
########################################

INSTALL_QDRANT=false
INSTALL_DOCKER=false

########################################
# Logging
########################################

ENABLE_VERBOSE_LOGGING=true
