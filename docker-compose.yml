services:
  # ==========================================
  # Backend FastAPI Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: retail-ai-backend

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    # Access host SQL Server
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      HOST: 0.0.0.0
      PORT: 8000

    # Uncomment only for local backend testing
    # ports:
    #   - "8000:8000"

    networks:
      - retail_ai_network

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================
  # Frontend React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api

    container_name: retail-ai-frontend

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - retail_ai_network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

# ==========================================
# Network
# ==========================================
networks:
  retail_ai_network:
    driver: bridge
    name: retail_ai_network