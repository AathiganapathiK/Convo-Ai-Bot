services:
  # ==========================================
  # Backend FastAPI Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: retail-ai-backend

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    # Access host SQL Server
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - APP_ENV=${APP_ENV}
      - HOST=0.0.0.0
      - PORT=8000

      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}

      - DB_TYPE=${DB_TYPE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DRIVER=${DB_DRIVER}

      - SKIP_DB_WAIT=${SKIP_DB_WAIT}
      - DB_WAIT_TIMEOUT=${DB_WAIT_TIMEOUT}

      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES}

      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER}
      - DEFAULT_MODEL=${DEFAULT_MODEL}

      - ALLOWED_TABLES=${ALLOWED_TABLES}

      - LOG_LEVEL=${LOG_LEVEL}

      - ENABLE_QDRANT=${ENABLE_QDRANT}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}

    # Uncomment only for local backend testing
    # ports:
    #   - "8000:8000"

    networks:
      - retail_ai_network

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================
  # Frontend React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api

    container_name: retail-ai-frontend

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - retail_ai_network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

# ==========================================
# Network
# ==========================================
networks:
  retail_ai_network:
    driver: bridge
    name: retail_ai_network